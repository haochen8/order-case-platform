# Local development only. Identity data is disposable; business data is persisted.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: casedb
      POSTGRES_USER: caseuser
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - case-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caseuser -d casedb"]
      interval: 5s
      timeout: 5s
      retries: 12
  identity:
    image: quay.io/keycloak/keycloak:26.7.4
    command: ["start-dev", "--import-realm"]
    environment:
      KC_HOSTNAME: http://localhost:9090
      KC_BOOTSTRAP_ADMIN_USERNAME: local-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: local-admin-only
    ports:
      - "127.0.0.1:9090:8080"
    volumes:
      - ./dev/keycloak-realm.json:/opt/keycloak/data/import/case-platform.json:ro
  backend:
    build: ./backend-spring
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/casedb
      SPRING_DATASOURCE_USERNAME: caseuser
      SPRING_DATASOURCE_PASSWORD: local-development-only
      JWT_ISSUER_URI: http://localhost:9090/realms/case-platform
      JWT_JWK_SET_URI: http://identity:8080/realms/case-platform/protocol/openid-connect/certs
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      identity:
        condition: service_started
volumes:
  case-data:
