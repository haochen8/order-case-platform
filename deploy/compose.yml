# Portable single-host release candidate. Do not merge with the local compose.yml.
name: order-case-release
services:
  app-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: casedb
      POSTGRES_USER: caseuser
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD}
    volumes: [app-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U caseuser -d casedb']
      interval: 10s
      timeout: 5s
      retries: 12
  identity-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${IDENTITY_DB_PASSWORD:?Set IDENTITY_DB_PASSWORD}
    volumes: [identity-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U keycloak -d keycloak']
      interval: 10s
      timeout: 5s
      retries: 12
  identity:
    image: quay.io/keycloak/keycloak:26.7.4
    command: [start, --import-realm]
    mem_limit: 1536m
    restart: unless-stopped
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://identity-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?Set IDENTITY_DB_PASSWORD}
      KC_HOSTNAME: https://${AUTH_HOST:?Set AUTH_HOST}
      KC_HTTP_ENABLED: 'true'
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: 'true'
      KC_BOOTSTRAP_ADMIN_USERNAME: ${ADMIN_USERNAME:?Set ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
    volumes:
      - ./generated/case-platform-realm.json:/opt/keycloak/data/import/case-platform-realm.json:ro
    depends_on:
      identity-db: {condition: service_healthy}
  api:
    image: ${API_IMAGE:?Set API_IMAGE to a verified release tag or digest}
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    environment:
      SPRING_PROFILES_ACTIVE: production
      SPRING_DATASOURCE_URL: jdbc:postgresql://app-db:5432/casedb
      SPRING_DATASOURCE_USERNAME: caseuser
      SPRING_DATASOURCE_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD}
      JWT_ISSUER_URI: https://${AUTH_HOST:?Set AUTH_HOST}/realms/case-platform
      JWT_JWK_SET_URI: http://identity:8080/realms/case-platform/protocol/openid-connect/certs
      CORS_ALLOWED_ORIGINS: ${FRONTEND_ORIGIN:?Set FRONTEND_ORIGIN}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70
    mem_limit: 768m
    healthcheck:
      test: [CMD, /bin/bash, -ec, 'exec 3<>/dev/tcp/127.0.0.1/8080; printf "GET /actuator/health HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3; head -n 1 <&3 | grep -q " 200 "']
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 6
    depends_on:
      app-db: {condition: service_healthy}
      identity: {condition: service_started}
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ['80:80', '443:443']
    environment:
      API_HOST: ${API_HOST:?Set API_HOST}
      AUTH_HOST: ${AUTH_HOST:?Set AUTH_HOST}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api: {condition: service_healthy}
      identity: {condition: service_started}
volumes:
  app-data:
  identity-data:
  caddy-data:
  caddy-config:
