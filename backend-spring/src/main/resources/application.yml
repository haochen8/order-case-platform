server:
  port: 8080

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/casedb}
    username: ${SPRING_DATASOURCE_USERNAME:caseuser}
    password: ${SPRING_DATASOURCE_PASSWORD:casepass}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

audit:
  base-url: ${AUDIT_BASE_URL:http://localhost:8081/api}
