name: Backend CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend-spring
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, mandatory PostgreSQL tests, and executable JAR
        run: ./gradlew --no-daemon check bootJar
      - name: Release input regression tests
        working-directory: .
        run: python3 -m unittest discover -s deploy -p 'test_*.py'
      - name: Build release container
        working-directory: .
        run: docker build -t order-case-platform-api:ci backend-spring
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend-spring/build/reports/tests/
